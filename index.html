<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ruženec</title>
  <meta name="description" content="Modlitba ruženca – klikaj na guľôčky, appka si pamätá, kde si skončil/a.">
  <meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)">
  <script>
    // Téma sa nastaví ešte pred vykreslením, aby stránka nezablikala
    try {
      var t = JSON.parse(localStorage.getItem("ruzenec.v1") || "{}").settings;
      if (t && (t.theme === "light" || t.theme === "dark")) document.documentElement.dataset.theme = t.theme;
    } catch (e) {}
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ruženec">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Domovská obrazovka: výber ruženca -->
  <main id="home" class="screen" hidden>
    <header class="home-header">
      <div id="today-date" class="today-date"></div>
      <h1>Ruženec</h1>
      <div class="bead-strip" aria-hidden="true">
        <i data-rosary="radostny"></i><i data-rosary="svetla"></i><i data-rosary="bolestny"></i><i data-rosary="slavnostny"></i>
      </div>
      <p class="subtitle">Ťukni na guľôčku, ktorú si sa pomodlil/a. Kde skončíš, tam budeš pokračovať.</p>
    </header>

    <section id="continue" class="continue-card" hidden>
      <div class="continue-info">
        <div class="eyebrow">Rozmodlené <span id="continue-pct"></span></div>
        <div id="continue-title" class="continue-title"></div>
        <div id="continue-meta" class="continue-meta"></div>
        <div class="bar" aria-hidden="true"><span></span></div>
      </div>
      <button id="continue-btn" class="btn btn-primary">Pokračovať</button>
    </section>

    <h2 class="section-title">Vyber ruženec</h2>
    <ul id="rosary-list" class="rosary-list"></ul>

    <h2 class="section-title">Nastavenia</h2>
    <div class="settings">
      <div class="toggle theme-row">
        <span id="theme-label">Vzhľad</span>
        <div class="segmented" role="radiogroup" aria-labelledby="theme-label">
          <label><input type="radio" name="theme" value="auto"><span>Auto</span></label>
          <label><input type="radio" name="theme" value="light"><span>Svetlý</span></label>
          <label><input type="radio" name="theme" value="dark"><span>Tmavý</span></label>
        </div>
      </div>
      <label class="toggle">
        <span>Zobrazovať celé texty modlitieb</span>
        <input type="checkbox" id="set-fulltext" role="switch">
      </label>
      <label class="toggle">
        <span>Nevypínať obrazovku počas modlitby</span>
        <input type="checkbox" id="set-awake" role="switch">
      </label>
    </div>
  </main>

  <!-- Modlitba -->
  <main id="pray" class="screen" hidden>
    <header class="pray-header">
      <button id="back-home" class="icon-btn" aria-label="Späť na výber ruženca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <div class="pray-title">
        <div id="pray-name"></div>
        <div class="progress" aria-hidden="true"><div id="progress-fill"></div></div>
        <div id="pray-saved" class="saved">Uložené</div>
      </div>
      <div class="header-actions">
      <button id="theme-btn" class="icon-btn" aria-label="Prepnúť svetlý / tmavý režim">
        <svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      </button>
      <button id="awake-btn" class="icon-btn" aria-pressed="false" aria-label="Nevypínať obrazovku">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></svg>
      </button>
      </div>
    </header>

    <div class="rosary-wrap">
      <svg id="rosary" viewBox="0 0 360 500" role="group" aria-label="Ruženec – klikni na guľôčku, ktorú si sa pomodlil/a"></svg>
    </div>

    <article id="text-card" class="text-card" aria-live="polite"></article>

    <nav class="controls">
      <button id="prev-btn" class="btn btn-ghost" aria-label="O krok späť">‹ Späť</button>
      <button id="next-btn" class="btn btn-primary">Pomodlené ✓</button>
    </nav>

    <div id="toast" class="toast" role="status" hidden>
      <span id="toast-text"></span>
      <button id="toast-undo" class="toast-undo">Vrátiť</button>
    </div>

    <div id="done" class="done" hidden>
      <div class="done-card">
        <svg class="done-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M6 8h12" /></svg>
        <h2>Ruženec je dokončený</h2>
        <p id="done-text"></p>
        <button id="done-home" class="btn btn-primary">Hotovo</button>
        <button id="done-review" class="btn btn-ghost">Pozrieť ešte raz záver</button>
      </div>
    </div>
  </main>

  <script src="js/prayers.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
